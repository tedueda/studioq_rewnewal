<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スタジオQ ブログ自動生成システム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 16px;
        }
        
        .form-container {
            padding: 40px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        input[type="text"], select, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        
        input[type="text"]:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .keyword-presets {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        
        .keyword-btn {
            padding: 8px 12px;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            font-size: 14px;
        }
        
        .keyword-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .generate-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        
        .generate-btn:hover {
            transform: translateY(-2px);
        }
        
        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.loading {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #0c5460;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .api-key-section {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }
        
        .api-key-section h3 {
            color: #856404;
            margin-bottom: 10px;
        }
        
        .api-key-section p {
            color: #856404;
            font-size: 14px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 ブログ自動生成システム</h1>
            <p>OpenAI APIを使用してスタジオQ向けの高品質なブログ記事を自動生成</p>
        </div>
        
        <div class="form-container">
            <div class="api-key-section">
                <h3>⚠️ 重要な注意事項</h3>
                <p>このシステムを使用するには、OpenAI APIキーが必要です。<br>
                <code>.env</code>ファイルに<code>OPENAI_API_KEY=your_api_key</code>を設定してください。</p>
            </div>
            
            <form id="blogForm">
                <div class="form-group">
                    <label for="keyword">キーワード</label>
                    <input type="text" id="keyword" name="keyword" placeholder="例: 4K映像制作">
                    <div class="keyword-presets">
                        <div class="keyword-btn" onclick="setKeyword('4K映像制作')">4K映像制作</div>
                        <div class="keyword-btn" onclick="setKeyword('グリーンスクリーン撮影')">グリーンスクリーン撮影</div>
                        <div class="keyword-btn" onclick="setKeyword('バーチャルスタジオ')">バーチャルスタジオ</div>
                        <div class="keyword-btn" onclick="setKeyword('ライブ配信')">ライブ配信</div>
                        <div class="keyword-btn" onclick="setKeyword('マルチカメラ撮影')">マルチカメラ撮影</div>
                        <div class="keyword-btn" onclick="setKeyword('RGB照明')">RGB照明</div>
                        <div class="keyword-btn" onclick="setKeyword('防音スタジオ')">防音スタジオ</div>
                        <div class="keyword-btn" onclick="setKeyword('クロマキー合成')">クロマキー合成</div>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="category">カテゴリー</label>
                    <select id="category" name="category">
                        <option value="">自動選択</option>
                        <option value="撮影テクニック">撮影テクニック</option>
                        <option value="機材レビュー">機材レビュー</option>
                        <option value="スタジオ活用術">スタジオ活用術</option>
                        <option value="業界トレンド">業界トレンド</option>
                        <option value="制作事例">制作事例</option>
                    </select>
                </div>
                
                <button type="submit" class="generate-btn" id="generateBtn">
                    🚀 ブログ記事を生成する
                </button>
            </form>
            
            <div id="status" class="status"></div>
        </div>
    </div>

    <script>
        function setKeyword(keyword) {
            document.getElementById('keyword').value = keyword;
        }
        
        document.getElementById('blogForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const keyword = document.getElementById('keyword').value;
            const category = document.getElementById('category').value;
            const generateBtn = document.getElementById('generateBtn');
            const status = document.getElementById('status');
            
            // ボタンを無効化
            generateBtn.disabled = true;
            generateBtn.innerHTML = '<div class="loading-spinner"></div>生成中...';
            
            // ステータス表示
            status.className = 'status loading';
            status.style.display = 'block';
            status.innerHTML = '<div class="loading-spinner"></div>ブログ記事を生成しています。しばらくお待ちください...';
            
            try {
                // APIサーバーにリクエスト送信
                const response = await fetch('http://localhost:3001/api/generate-blog', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ keyword, category })
                });
                
                const result = await response.json();
                
                if (response.ok && result.success) {
                    status.className = 'status success';
                    status.innerHTML = `✅ ブログ記事が正常に生成されました！<br>ファイル: ${result.filename}<br><br>詳細: ${result.output}`;
                } else {
                    throw new Error(result.error || '生成に失敗しました');
                }
            } catch (error) {
                console.error('エラー詳細:', error);
                status.className = 'status error';
                status.innerHTML = `❌ エラーが発生しました: ${error.message}<br><br>
                    <strong>解決方法:</strong><br>
                    1. サーバーが起動していることを確認: <code>node server.js</code><br>
                    2. または手動実行: <code>cd blog-generator && node generate.js "${keyword}"</code>`;
            }
            
            // ボタンを再有効化
            generateBtn.disabled = false;
            generateBtn.innerHTML = '🚀 ブログ記事を生成する';
        });
    </script>
</body>
</html>
